[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-radar"
version = "0.1.0"
description = "面向单用户的学术论文发现、筛选与研读流水线"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.17,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "typer>=0.19,<1",
]

[project.scripts]
paper-radar = "paper_radar.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_radar"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
tmp_path_retention_policy = "failed"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # 中文用户界面需要全角标点。

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[project.optional-dependencies]
docling = [
    "docling-slim[convert-core,format-pdf,models-local]==2.135.0 ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
    "docling-core==2.105.0 ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
    "docling-ibm-models[opencv-python-headless]==4.0.3 ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
    "docling-parse==7.22.2 ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
    "pypdfium2==5.14.0 ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
    "torch==2.14.1+cpu ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
    "torchvision==0.29.1+cpu ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
    "transformers==5.19.0 ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
    "typer==0.27.2 ; sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and python_version == '3.12'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and python_version == '3.13'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and python_version == '3.14'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'" }
